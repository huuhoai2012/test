name: build
on: [push, workflow_dispatch]
jobs:
  b:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          xcrun -sdk iphoneos clang++ -arch arm64 -dynamiclib -fobjc-arc -std=c++17 \
            -miphoneos-version-min=12.0 -Wno-deprecated-declarations \
            -framework Foundation -framework UIKit -o tweak.dylib tweak.mm
      - uses: actions/upload-artifact@v4
        with: { name: tweak, path: tweak.dylib }
